name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.0.1 or git SHA
  - type: dropdown
    id: part
    attributes:
      label: Where
      options: [Clipboard history (PC), iPad drawing, Installation / AppImage, Other]
  - type: input
    id: system
    attributes:
      label: System
      placeholder: e.g. Pop!_OS 24.04, COSMIC 1.0, iPadOS 18.5
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `RUST_LOG=cosmic_clipboard=debug ./Clipstack-x86_64.AppImage` in a terminal and paste the relevant output."
      render: text
