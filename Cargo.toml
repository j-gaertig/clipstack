[package]
name = "cosmic-clipboard"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "Super+V clipboard history for Linux, Windows and macOS, with iPad drawing"
repository = "https://github.com/j-gaertig/clipstack"
readme = "README.md"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "net", "io-util", "sync"] }
dirs = "6"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2"
percent-encoding = "2"
tiny_http = "0.12"
jiff = "0.2"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["winit", "tokio", "multi-window", "qr_code"]

[target.'cfg(target_os = "linux")'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["wayland", "x11", "single-instance", "dbus-config"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xtest", "randr"] }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-graphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[build-dependencies]
embed-resource = "3.0.12"
